[project]
name = "business-entity-resolution"
version = "0.1.0"
description = "Entity resolution across three noisy multilingual business-record sources (ML Challenge 2026)"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # data
    "numpy>=1.26",
    "polars>=1.0",
    "pyarrow>=16.0",
    "pyyaml>=6.0",
    # text similarity / normalization
    "rapidfuzz>=3.9",
    "unidecode>=1.3",
    "regex>=2024.5.15",
    # vector search
    "faiss-cpu>=1.8",
    # embedding client
    "httpx>=0.27",
    "tqdm>=4.66",
    # models
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "xgboost>=2.1",
    "torch>=2.4",
]

[project.optional-dependencies]
# Optional ChromaDB backend for the VectorStore interface (AWS / managed use).
chroma = ["chromadb>=0.5"]
# Only needed if you run the embedder with the `torch-mps` backend instead of a server.
local-encoder = ["transformers>=4.44", "sentence-transformers>=3.0"]
dev = ["pytest>=8.2", "ruff>=0.5"]

[project.scripts]
ber = "ber.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ber"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
