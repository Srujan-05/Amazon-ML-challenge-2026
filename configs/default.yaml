# Business Entity Resolution — pipeline configuration.
# Every tunable knob lives here; no magic numbers in code.

paths:
  data_root: student_resource/dataset
  vectors: vectors           # embedding shards + FAISS indices
  artifacts: artifacts       # trained models, stats JSON, candidate caches
  output: output             # matching_results.tsv, candidate_pairs.tsv

sources:
  # Logical source name -> filename stem. The record's source is given by its
  # entity_id prefix (S1-/S2-/S3-), per the problem statement.
  S1: source1
  S2: source2
  S3: source3

embedding:
  model: Qwen/Qwen3-Embedding-0.6B      # Apache-2.0, instruction-aware, MRL-capable
  gguf_repo: Qwen/Qwen3-Embedding-0.6B-GGUF
  gguf_file: Qwen3-Embedding-0.6B-Q8_0.gguf
  dim: 512                  # MRL truncation from the native 1024; 256 is the fallback lever
  native_dim: 1024
  max_tokens: 96            # name + address normalized; p99 fits comfortably
  instruction_file: configs/instruction.txt
  backend: llamacpp         # llamacpp | vllm | torch-mps
  endpoint: http://localhost:8080/v1/embeddings
  batch_size: 128           # per HTTP request
  concurrency: 4            # in-flight requests
  shard_size: 250000        # records per shard file; bounds re-work on interrupt
  dtype: float16

vector_store:
  backend: faiss            # faiss | chroma
  # auto picks hnsw when the estimated index fits max_index_bytes, else ivfpq.
  # At 512d an hnsw index over the 4.72M-record India partition needs ~11 GB,
  # so on a 36 GB machine auto will choose ivfpq there and hnsw for France.
  index_type: auto          # auto | hnsw | ivfpq
  max_index_bytes: 8589934592   # 8 GiB budget per country index
  hnsw:
    M: 32
    ef_construction: 200
    ef_search: 128
  ivfpq:
    nlist: 4096
    m: 64                   # subquantizers; dim must be divisible by m
    nbits: 8
    nprobe: 32              # cells probed per query; higher = better recall, slower
  # Searches never cross a country partition: country never disagrees across a
  # true match (0 / 13,836 sampled pairs). Treated as an open set of labels --
  # nothing here hardcodes US/India, so France passes through untouched.
  partition_by: country

blocking:
  k: 50                     # final candidates per S1 entity, after fusing channels
  lexical:
    enabled: true
    top_n: 50               # lexical alone can fill the whole budget
    min_digits: 3           # shorter digit runs are too common to be selective
    max_df_ratio: 0.3       # buckets above this document frequency are dropped
    # One hashed inverted index carries all four key types, each weighted.
    # Tuned by sweep on training ground truth: 99.0% pair recall at K=50
    # (97.2% flat, 98.7% without the trigram channel). See `ber block --sweep`.
    #   d = digit tokens (house no./PIN)   a = address tokens
    #   n = name tokens                    s = romanized squeezed name (cross-script)
    #   g = name character trigrams (domain-style names, typos)
    channel_weights:
      d: 1.3
      a: 1.2
      n: 1.0
      s: 0.9
      g: 0.6
  dense_ann:
    enabled: true
    top_n: 25               # cross-script / trade-name rescue channel
  rrf_k0: 60.0              # Reciprocal Rank Fusion damping

features:
  ngram_size: 3
  idf_min_df: 2
  # Tokens appearing in more than this fraction of a country's records carry no
  # discriminative signal (e.g. "road", "private", "limited").
  idf_max_df_ratio: 0.3

training:
  # ~200k sampled S1 entities x ~50 candidates ~= 10M pairs.
  # Use sample_entities: 20000 for the ~1M-pair fallback config.
  sample_entities: 200000
  target_pairs: 10000000
  val_fraction: 0.15        # split BY ENTITY, never by pair (leakage)
  test_fraction: 0.15
  random_seed: 42
  negatives_per_positive: null   # null = keep every blocked candidate as-is
  device: auto              # auto -> mps | cuda | cpu

models:
  lightgbm:
    n_estimators: 1200
    learning_rate: 0.05
    num_leaves: 127
    min_child_samples: 100
    subsample: 0.8
    colsample_bytree: 0.8
    scale_pos_weight: 0.5   # < 1 biases toward precision, matching F_0.5
  xgboost:
    n_estimators: 1200
    learning_rate: 0.05
    max_depth: 8
    subsample: 0.8
    colsample_bytree: 0.8
    scale_pos_weight: 0.5
  mlp:
    hidden: [256, 128, 64]
    dropout: 0.15
    lr: 0.001
    epochs: 12
    batch_entities: 256     # batches are grouped BY ENTITY so soft-F_beta works
  # NN variant 2. Named for what it does: each pair is scored with a context
  # vector pooled over its sibling candidates, so the model can see that
  # candidates within an entity compete (each S2/S3 record matches at most one
  # S1 entity). A literal siamese tower would need the raw 512-d embeddings of
  # both records per pair (~40 GB at 10M pairs) to learn a similarity the dense
  # cosine feature already provides.
  entity_attn:
    proj_dim: 128
    hidden: [256, 128]
    dropout: 0.15
    lr: 0.001
    epochs: 12
    batch_entities: 256

loss:
  # F_0.5 is the eval metric and is not differentiable, so NNs optimize a
  # per-entity soft-F_beta surrogate; weighted BCE is the baseline/ablation.
  kind: soft_fbeta          # soft_fbeta | weighted_bce
  beta: 0.5
  fp_weight: 2.0            # used by weighted_bce; beta=0.5 weights precision 2x

decision:
  threshold: null           # null = tune on the validation split
  threshold_grid: [0.05, 0.95, 91]   # start, stop, steps
  enforce_exclusivity: true # each S2/S3 record belongs to at most one S1 (verified)
  max_per_source: null      # null = uncapped; GT ceiling observed is 5 (S2) / 6 (S3)

evaluation:
  beta: 0.5                 # macro F_0.5, averaged over ALL S1 entities
